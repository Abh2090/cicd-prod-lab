name: CI-CD Blue Green

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

            CURRENT=$(grep -o '300[12]' /etc/nginx/nginx.conf)

            if [ "$CURRENT" = "3001" ]; then
              echo "BLUE active → switching to GREEN"

              docker stop green || true
              docker rm green || true

              docker run -d -p 3002:3000 \
              -e MESSAGE="Hello from GREEN 💚" \
              --name green \
              ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

              sudo sed -i 's/3001/3002/' /etc/nginx/nginx.conf

            else
              echo "GREEN active → switching to BLUE"

              docker stop blue || true
              docker rm blue || true

              docker run -d -p 3001:3000 \
              -e MESSAGE="Hello from BLUE 💙" \
              --name blue \
              ${{ secrets.DOCKER_USERNAME }}/cicd-app:latest

              sudo sed -i 's/3002/3001/' /etc/nginx/nginx.conf

            fi

            sudo systemctl restart nginx
